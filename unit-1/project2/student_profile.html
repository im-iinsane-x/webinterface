<!DOCTYPE html>
<html>
<head>

<title>Student Profile Card</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color: lightblue;
    text-align: center;
}

.container{
    width: 300px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 50px;
}

input{
    width: 90%;
    padding: 10px;
    margin: 10px;
}

button{
    padding: 10px 20px;
    background: darkgreen;
    color: sandybrown;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.card{
    margin-top: 20px;
    background: #f2f2f2;
    padding: 15px;
    border-radius: 10px;
    display: none;
}

h2{
    color: darkblue;
}
</style>

</head>

<body>

<div class="container">

<h2>Student Profile</h2>

<input type="text" id="name" placeholder="Enter Name">

<input type="text" id="roll" placeholder="Enter Roll Number">

<input type="number" id="marks" placeholder="Enter Marks">

<br>

<button onclick="displayProfile()">Display Profile</button>

<div class="card" id="profile">

<h3 id="sname"></h3>

<p id="sroll"></p>

<p id="smarks"></p>

<p id="sgrade"></p>

</div>

</div>

<script>

function displayProfile()
{
    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = parseInt(document.getElementById("marks").value);

    let grade;

    if(marks >= 90 && marks < 100)
    {
        grade = "A+";
    }
    else if(marks >= 80)
    {
        grade = "A";
    }
    else if(marks >= 70)
    {
        grade = "B";
    }
    else if(marks >= 60)
    {
        grade = "C";
    }
    else if(marks >= 50)
    {
        grade = "D";
    }
    else if(marks > 100)
    {
        grade = "not defined";
    }
    else
    {
        grade = "Fail";
    }

    document.getElementById("sname").innerHTML = "Name : " + name;
    document.getElementById("sroll").innerHTML = "Roll No : " + roll;
    document.getElementById("smarks").innerHTML = "Marks : " + marks;
    document.getElementById("sgrade").innerHTML = "Grade : " + grade;

    document.getElementById("profile").style.display = "block";
}

</script>

</body>
</html>
