<!DOCTYPE html>
<html>
<head>
 <title>Counter App</title>
 <style>
 body{
 font-family: Arial, sans-serif;
 background:#f2f2f2;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
 }
 .container{
 background:white;
 padding:30px;
 border-radius:10px;
 text-align:center;
 box-shadow:0 0 10px gray;
 }
 h1{
 margin-bottom:20px;
 }
 #count{
 font-size:50px;
 margin:20px;
 color:blue;
 }
 button{
 padding:10px 20px;
 margin:5px;
 font-size:16px;
 cursor:pointer;
 }
 </style>
</head>
<body>
<div class="container">
<h1>Counter App</h1>
<div id="count">0</div>
<button onclick="increase()">Increment</button>
<button onclick="decrease()">Decrement</button>
<button onclick="reset()">Reset</button>
</div>
<script>
let count = 0;
function increase(){
 count++;
 document.getElementById("count").innerHTML = count;
}
function decrease(){
 count--;
 document.getElementById("count").innerHTML = count;
}
function reset(){
 count = 0;
 document.getElementById("count").innerHTML = count;
}
</script>
</body>
</html>
